<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Time Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e85d04" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TimeCal" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root[data-theme="dark"] {
      --bg:        #0d0d0f;
      --surface:   #18181b;
      --surface2:  #232329;
      --border:    #2e2e36;
      --text:      #f0f0f0;
      --text-sub:  #888;
      --display-bg:#050508;
      --display-fg:#39ff6e;
      --display-glow: 0 0 18px #39ff6e55;
      --key-num:   #26262e;
      --key-util:  #1f1f28;
      --key-op:    #e85d04;
      --key-op-hover: #ff6b1a;
      --key-num-hover: #32323e;
      --key-text:  #f0f0f0;
      --shadow:    0 12px 40px rgba(0,0,0,0.6);
      --input-bg:  #0d0d0f;
      --active-ring: #e85d04;
      --toggle-bg: #26262e;
      --op-plus:   #39ff6e;
      --op-minus:  #6b9fff;
    }
    :root[data-theme="light"] {
      --bg:        #f0ede8;
      --surface:   #faf9f7;
      --surface2:  #eeecea;
      --border:    #d8d5cf;
      --text:      #1a1a1a;
      --text-sub:  #777;
      --display-bg:#1a1a22;
      --display-fg:#39ff6e;
      --display-glow: 0 0 18px #39ff6e44;
      --key-num:   #e8e5e0;
      --key-util:  #dedad4;
      --key-op:    #e85d04;
      --key-op-hover: #ff6b1a;
      --key-num-hover: #d8d4ce;
      --key-text:  #1a1a1a;
      --shadow:    0 12px 40px rgba(0,0,0,0.12);
      --input-bg:  #f0ede8;
      --active-ring: #e85d04;
      --toggle-bg: #e8e5e0;
      --op-plus:   #1a9e3f;
      --op-minus:  #2255cc;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 5vw, 24px) clamp(8px, 3vw, 12px) clamp(32px, 8vw, 48px);
      transition: background 0.3s, color 0.3s;
      overflow-y: auto;
    }

    .app {
      width: 95%;
      max-width: 400px;
      max-height: 100vh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: 24px;
      padding: clamp(16px, 4vw, 20px);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: background 0.3s, box-shadow 0.3s;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: clamp(12px, 3vw, 18px);
    }
    .header h1 {
      font-size: clamp(15px, 4vw, 17px);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: clamp(4px, 2vw, 8px);
    }
    .version-badge {
      font-size: clamp(10px, 3vw, 11px);
      font-weight: 600;
      font-family: 'Share Tech Mono', monospace;
      color: var(--text-sub);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      letter-spacing: 0.05em;
    }
    .theme-toggle {
      display: flex;
      align-items: center;
      gap: clamp(4px, 2vw, 8px);
      background: var(--toggle-bg);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: clamp(4px, 1.5vw, 5px) clamp(8px, 3vw, 12px);
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: clamp(12px, 3.5vw, 13px);
      font-weight: 600;
      color: var(--text-sub);
      transition: all 0.2s;
      -webkit-user-select: none; user-select: none;
    }
    .theme-toggle:hover { color: var(--text); }
    .theme-toggle .icon { font-size: 15px; }

    /* ── Display ── */
    .display {
      background: var(--display-bg);
      color: var(--display-fg);
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(32px, 10vw, 42px);
      letter-spacing: 0.08em;
      padding: clamp(12px, 4vw, 18px) clamp(12px, 5vw, 20px) 10px;
      border-radius: 16px 16px 0 0;
      text-align: right;
      box-shadow: var(--display-glow), inset 0 2px 8px rgba(0,0,0,0.4);
      transition: box-shadow 0.3s;
      overflow: hidden;
      white-space: nowrap;
    }
    @media (max-width: 350px) {
      .display {
        white-space: normal;
        overflow-wrap: break-word;
      }
    }

    /* ── Sub Display ── */
    .sub-display {
      background: var(--display-bg);
      border-radius: 0 0 16px 16px;
      padding: 4px clamp(12px, 5vw, 20px) 12px;
      text-align: right;
      margin-bottom: clamp(10px, 3vw, 14px);
      min-height: 28px;
      border-top: 1px solid #ffffff0a;
    }
    .formula-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 20px;
      color: #39ff6ecc;
      letter-spacing: 0.05em;
      padding: 2px 0 4px;
      transition: opacity 0.2s;
    }
    .formula-text.hidden { opacity: 0; pointer-events: none; }
    .sub-display-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: #39ff6e88;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    .sub-display-text.hidden {
      opacity: 0;
    }

    /* ── Input rows ── */
    .inputs {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 2vw, 8px);
      margin-bottom: 8px;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: clamp(4px, 2vw, 8px);
      transition: opacity 0.2s;
    }

    .op-spacer {
      width: clamp(24px, 6vw, 32px);
      flex-shrink: 0;
    }

    .op-toggle {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--op-plus);
      font-family: 'Share Tech Mono', monospace;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      line-height: 1;
    }
    .op-toggle.minus {
      color: var(--op-minus);
      border-color: color-mix(in srgb, var(--op-minus) 30%, transparent);
    }
    .op-toggle:hover {
      background: var(--key-num-hover);
      transform: scale(1.08);
    }

    .input-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-sub);
      width: clamp(12px, 3vw, 16px);
      text-align: center;
      flex-shrink: 0;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--input-padding-bg, var(--input-bg));
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: 20px;
      letter-spacing: 0.06em;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
      caret-color: var(--active-ring);
    }
    input[type="text"].active-field {
      border-color: var(--active-ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--active-ring) 20%, transparent);
    }
    input[type="text"]::placeholder { color: var(--border); }

    .del-spacer {
      width: clamp(20px, 4vw, 26px);
      flex-shrink: 0;
    }

    .del-row {
      width: clamp(22px, 5vw, 26px);
      height: clamp(22px, 5vw, 26px);
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-sub);
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-weight: 700;
    }
    .del-row:hover {
      background: #ff4d4d1a;
      color: #ff6b6b;
      border-color: #ff6b6b44;
    }

    /* ── Add row button ── */
    .add-row-btn {
      width: 100%;
      padding: clamp(8px, 2vw, 9px);
      border-radius: 10px;
      border: 1.5px dashed var(--border);
      background: transparent;
      color: var(--text-sub);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: clamp(10px, 3vw, 14px);
      letter-spacing: 0.04em;
    }
    .add-row-btn:hover {
      border-color: var(--active-ring);
      color: var(--active-ring);
      background: color-mix(in srgb, var(--active-ring) 5%, transparent);
    }

    /* ── Keyboard hint ── */
    .kb-hint {
      display: flex;
      align-items: center;
      gap: clamp(4px, 2vw, 6px);
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 14px;
      padding: clamp(4px, 2vw, 6px) clamp(8px, 2vw, 10px);
      background: var(--surface2);
      border-radius: 8px;
      border: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .kb-hint .tag {
      background: var(--key-util);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
    }

    /* ── Keypad ── */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(4px, 2vw, 8px);
      -webkit-user-select: none; user-select: none;
    }
    .key {
      padding: 0;
      height: clamp(54px, 12vw, 62px);
      border-radius: clamp(10px, 3vw, 14px);
      border: 1px solid var(--border);
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.08s, box-shadow 0.15s;
      background: var(--key-num);
      color: var(--key-text);
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .key.util {
      background: var(--key-util);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-sub);
    }
    .key.op {
      background: var(--key-op);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--key-op) 40%, transparent);
    }
    .key.op:hover  { background: var(--key-op-hover); }
    .key:hover:not(.op) { background: var(--key-num-hover); }
    .key:active { transform: scale(0.95); }
    .key.wide { grid-column: span 2; }

    /* ── Sep ── */
    .sep {
      height: 1px;
      background: var(--border);
      margin: clamp(10px, 3vw, 14px) 0;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #e85d04;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      opacity: 0;
      transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* row entry animation */
    @keyframes rowIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .input-row.new {
      animation: rowIn 0.2s ease forwards;
    }

    @media (max-width: 380px) {
      .display { font-size: 34px; }
      .key { height: 54px; font-size: 18px; }
    }

    /* ── Mode toggle ── */
    .mode-toggle-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }
    .mode-toggle {
      display: flex;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }
    .mode-btn {
      padding: 6px 22px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-user-select: none; user-select: none;
    }
    .mode-btn.active {
      background: var(--key-op);
      color: #fff;
      box-shadow: 0 2px 8px color-mix(in srgb, var(--key-op) 40%, transparent);
    }
    .mode-btn:not(.active):hover { color: var(--text); }

    /* ── Realtime base display ── */
    .realtime-base {
      display: none;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: #39ff6e88;
      letter-spacing: 0.05em;
      text-align: center;
      margin-bottom: 4px;
    }
    .realtime-base.visible { display: block; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>⏱ Time Calc <span class="version-badge">v2</span></h1>
    <button class="theme-toggle" id="themeToggle" aria-label="テーマ切替">
      <span class="icon" id="themeIcon">☀️</span>
      <span id="themeLabel">Light</span>
    </button>
  </div>

  <div class="mode-toggle-wrap">
    <div class="mode-toggle" id="modeToggle">
      <button class="mode-btn active" data-mode="duration">時間計算</button>
      <button class="mode-btn" data-mode="realtime">実時間</button>
    </div>
  </div>

  <div id="display" class="display">00:00:00</div>
  <div class="sub-display">
    <div class="formula-text hidden" id="formulaDisplay"></div>
    <span class="sub-display-text hidden" id="subDisplay"></span>
  </div>

  <div class="inputs" id="inputsContainer"></div>

  <button class="add-row-btn" id="addRowBtn">＋ 行を追加 (最大10行)</button>

  <div class="kb-hint" id="kbHint">
    <span>⌨️</span>
    <span class="tag">0–9</span>
    <span class="tag">+</span>
    <span class="tag">-</span>
    <span class="tag">Enter</span>
    <span class="tag">⌫</span>
    <span class="tag">C</span>
    <span class="tag">Tab で行切替</span>
    <span class="tag">A〜J で行選択</span>
  </div>

  <div class="keypad" id="keypad">
    <!-- Row 1: util -->
    <button class="key util" data-action="prevRow">↑行</button>
    <button class="key util" data-action="nextRow">↓行</button>
    <button class="key util" data-action="copyResultToA">→A</button>
    <button class="key util" data-action="clear">C</button>

    <!-- Row 2 -->
    <button class="key" data-num="7">7</button>
    <button class="key" data-num="8">8</button>
    <button class="key" data-num="9">9</button>
    <button class="key op" data-op="add">+</button>

    <!-- Row 3 -->
    <button class="key" data-num="4">4</button>
    <button class="key" data-num="5">5</button>
    <button class="key" data-num="6">6</button>
    <button class="key op" data-op="sub">−</button>

    <!-- Row 4 -->
    <button class="key" data-num="1">1</button>
    <button class="key" data-num="2">2</button>
    <button class="key" data-num="3">3</button>
    <button class="key" data-num="0">0</button>
  </div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const MAX_ROWS = 10;
const LABELS = 'ABCDEFGHIJ';
let rows = [];        // [{raw, sign, rowEl, inputEl}]
let activeRowIdx = 0;
let mode = 'duration';
let toastTimer = null;

// ── DOM refs ───────────────────────────────────────────────────────────────
const display     = document.getElementById('display');
const formulaEl   = document.getElementById('formulaDisplay');
const subEl       = document.getElementById('subDisplay');
const inputsCont  = document.getElementById('inputsContainer');
const addRowBtn   = document.getElementById('addRowBtn');
const themeToggle = document.getElementById('themeToggle');
const themeIcon   = document.getElementById('themeIcon');
const themeLabel  = document.getElementById('themeLabel');
const modeToggle  = document.getElementById('modeToggle');
const keypad      = document.getElementById('keypad');
const html        = document.documentElement;

// toast element
const toast = document.createElement('div');
toast.className = 'toast';
document.body.appendChild(toast);

// ── Time helpers ───────────────────────────────────────────────────────────
function formatRaw(raw) {
  const p = raw.padStart(6, '0');
  return `${p.slice(0,2)}:${p.slice(2,4)}:${p.slice(4,6)}`;
}

function rawToSeconds(raw) {
  const p = raw.padStart(6, '0');
  return parseInt(p.slice(0,2),10)*3600
       + parseInt(p.slice(2,4),10)*60
       + parseInt(p.slice(4,6),10);
}

function secondsToDisplay(total) {
  const neg = total < 0;
  const abs = Math.abs(total);
  const hh  = Math.floor(abs / 3600);
  const mm  = Math.floor((abs % 3600) / 60);
  const ss  = abs % 60;
  const s   = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  return neg ? `−${s}` : s;
}

function secondsToRaw(secs) {
  const abs = Math.abs(secs);
  const hh  = Math.min(Math.floor(abs / 3600), 99);
  const mm  = Math.floor((abs % 3600) / 60);
  const ss  = abs % 60;
  return `${String(hh).padStart(2,'0')}${String(mm).padStart(2,'0')}${String(ss).padStart(2,'0')}`;
}

// ── Theme ──────────────────────────────────────────────────────────────────
function applyTheme(theme) {
  html.setAttribute('data-theme', theme);
  localStorage.setItem('theme', theme);
  if (theme === 'dark') {
    themeIcon.textContent = '☀️';
    themeLabel.textContent = 'Light';
  } else {
    themeIcon.textContent = '🌙';
    themeLabel.textContent = 'Dark';
  }
}

themeToggle.addEventListener('click', () => {
  applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

applyTheme(localStorage.getItem('theme') || 'dark');

// ── Mode toggle ────────────────────────────────────────────────────────────
modeToggle.addEventListener('click', (e) => {
  const btn = e.target.closest('.mode-btn');
  if (!btn) return;
  const next = btn.dataset.mode;
  if (next === mode) return;
  mode = next;
  modeToggle.querySelectorAll('.mode-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode)
  );
  recalculate();
});

// ── Row creation ───────────────────────────────────────────────────────────
function createRowEl(idx, sign) {
  const isFirst = idx === 0;
  const label = LABELS[idx];
  const div = document.createElement('div');
  div.className = 'input-row new';

  if (isFirst) {
    const sp = document.createElement('div');
    sp.className = 'op-spacer';
    div.appendChild(sp);
  } else {
    const opBtn = document.createElement('button');
    opBtn.className = `op-toggle${sign === '-' ? ' minus' : ''}`;
    opBtn.dataset.sign = sign;
    opBtn.textContent = sign;
    opBtn.addEventListener('click', () => {
      const row = rows.find(r => r.rowEl === div);
      if (!row) return;
      row.sign = row.sign === '+' ? '-' : '+';
      opBtn.dataset.sign = row.sign;
      opBtn.textContent = row.sign;
      opBtn.classList.toggle('minus', row.sign === '-');
      setActive(rows.indexOf(row));
      recalculate();
    });
    div.appendChild(opBtn);
  }

  const labelEl = document.createElement('span');
  labelEl.className = 'input-label';
  labelEl.textContent = label;
  div.appendChild(labelEl);

  const input = document.createElement('input');
  input.type = 'text';
  input.setAttribute('inputmode', 'none');
  input.readOnly = true;
  input.value = '00:00:00';
  input.placeholder = '00:00:00';
  input.setAttribute('aria-label', `行 ${label}`);
  input.addEventListener('focus', () => setActive(rows.findIndex(r => r.rowEl === div)));
  input.addEventListener('pointerdown', (e) => { e.preventDefault(); input.focus(); });
  div.appendChild(input);

  if (isFirst) {
    const sp = document.createElement('div');
    sp.className = 'del-spacer';
    div.appendChild(sp);
  } else {
    const delBtn = document.createElement('button');
    delBtn.className = 'del-row';
    delBtn.textContent = '×';
    delBtn.setAttribute('aria-label', `行 ${label} を削除`);
    delBtn.addEventListener('click', () => {
      const rowIdx = rows.findIndex(r => r.rowEl === div);
      if (rowIdx > 0) deleteRow(rowIdx);
    });
    div.appendChild(delBtn);
  }

  return { rowEl: div, inputEl: input };
}

// ── Row management ─────────────────────────────────────────────────────────
function addRow(sign = '+') {
  if (rows.length >= MAX_ROWS) { showToast('最大10行まで'); return; }
  const idx = rows.length;
  const { rowEl, inputEl } = createRowEl(idx, sign);
  rows.push({ raw: '', sign: idx === 0 ? '+' : sign, rowEl, inputEl });
  inputsCont.appendChild(rowEl);
  addRowBtn.disabled = rows.length >= MAX_ROWS;
  setActive(idx);
  recalculate();
}

function deleteRow(idx) {
  if (idx <= 0 || idx >= rows.length) return;
  const snapshot = rows.map(r => ({ raw: r.raw, sign: r.sign }));
  snapshot.splice(idx, 1);
  rows = [];
  inputsCont.innerHTML = '';
  snapshot.forEach((s, i) => {
    const { rowEl, inputEl } = createRowEl(i, s.sign);
    rows.push({ raw: s.raw, sign: s.sign, rowEl, inputEl });
    inputEl.value = s.raw ? formatRaw(s.raw) : '00:00:00';
    inputsCont.appendChild(rowEl);
  });
  addRowBtn.disabled = rows.length >= MAX_ROWS;
  setActive(Math.min(activeRowIdx, rows.length - 1));
  recalculate();
}

// ── Active row ─────────────────────────────────────────────────────────────
function setActive(idx) {
  if (idx < 0 || idx >= rows.length) return;
  activeRowIdx = idx;
  rows.forEach((r, i) => r.inputEl.classList.toggle('active-field', i === activeRowIdx));
  rows[activeRowIdx].inputEl.focus({ preventScroll: true });
}

function navigateRow(delta) {
  setActive((activeRowIdx + delta + rows.length) % rows.length);
}

function selectRowByLabel(label) {
  const idx = LABELS.indexOf(label.toUpperCase());
  if (idx >= 0 && idx < rows.length) setActive(idx);
}

// ── Input logic ────────────────────────────────────────────────────────────
function inputDigit(d) {
  const row = rows[activeRowIdx];
  if (!row || row.raw.length >= 6) return;
  row.raw += d;
  row.inputEl.value = formatRaw(row.raw);
  recalculate();
}

function backspace() {
  const row = rows[activeRowIdx];
  if (!row || row.raw.length === 0) return;
  row.raw = row.raw.slice(0, -1);
  row.inputEl.value = row.raw ? formatRaw(row.raw) : '00:00:00';
  recalculate();
}

function clearActive() {
  const row = rows[activeRowIdx];
  if (!row) return;
  if (row.raw !== '') {
    row.raw = '';
    row.inputEl.value = '00:00:00';
  } else {
    rows.forEach(r => { r.raw = ''; r.inputEl.value = '00:00:00'; });
  }
  recalculate();
}

function setSign(sign) {
  if (activeRowIdx === 0) return;
  const row = rows[activeRowIdx];
  if (!row) return;
  row.sign = sign;
  const opBtn = row.rowEl.querySelector('.op-toggle');
  if (opBtn) {
    opBtn.dataset.sign = sign;
    opBtn.textContent = sign;
    opBtn.classList.toggle('minus', sign === '-');
  }
  recalculate();
}

// ── Calculation ────────────────────────────────────────────────────────────
function recalculate() {
  if (rows.length === 0) {
    display.textContent = '00:00:00';
    formulaEl.classList.add('hidden');
    subEl.classList.add('hidden');
    return;
  }

  let total = 0;
  const parts = [];
  rows.forEach((row, i) => {
    const secs = rawToSeconds(row.raw);
    total += row.sign === '-' ? -secs : secs;
    parts.push(i === 0 ? formatRaw(row.raw) : `${row.sign === '-' ? '−' : '+'} ${formatRaw(row.raw)}`);
  });

  if (mode === 'realtime') {
    total = ((total % 86400) + 86400) % 86400;
  }

  display.textContent = secondsToDisplay(total);

  if (rows.length > 1) {
    formulaEl.textContent = parts.join(' ');
    formulaEl.classList.remove('hidden');
  } else {
    formulaEl.classList.add('hidden');
  }

  const absMin = Math.floor(Math.abs(total) / 60);
  if (absMin > 0 && mode === 'duration') {
    subEl.textContent = `= ${total < 0 ? '−' : ''}${absMin} 分`;
    subEl.classList.remove('hidden');
  } else {
    subEl.classList.add('hidden');
  }
}

// ── Copy result to row A ───────────────────────────────────────────────────
function copyResultToA() {
  let total = 0;
  rows.forEach(row => {
    total += row.sign === '-' ? -rawToSeconds(row.raw) : rawToSeconds(row.raw);
  });
  if (mode === 'realtime') total = ((total % 86400) + 86400) % 86400;
  if (total < 0) { showToast('マイナス値はコピー不可'); return; }

  rows[0].raw = secondsToRaw(total);
  rows[0].inputEl.value = formatRaw(rows[0].raw);
  rows.slice(1).forEach(r => { r.raw = ''; r.inputEl.value = '00:00:00'; });
  setActive(0);
  recalculate();
  showToast('結果を行Aにコピーしました');
}

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ── Keypad ─────────────────────────────────────────────────────────────────
keypad.addEventListener('click', (e) => {
  const key = e.target.closest('.key');
  if (!key) return;
  if (key.dataset.num !== undefined) {
    inputDigit(key.dataset.num);
  } else if (key.dataset.action) {
    switch (key.dataset.action) {
      case 'prevRow':       navigateRow(-1);    break;
      case 'nextRow':       navigateRow(1);     break;
      case 'clear':         clearActive();      break;
      case 'copyResultToA': copyResultToA();    break;
    }
  } else if (key.dataset.op) {
    setSign(key.dataset.op === 'add' ? '+' : '-');
  }
});

// ── Keyboard ───────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' && !rows.some(r => r.inputEl === e.target)) return;
  if (e.key >= '0' && e.key <= '9')       { inputDigit(e.key); e.preventDefault(); }
  else if (e.key === '+')                  { setSign('+');       e.preventDefault(); }
  else if (e.key === '-')                  { setSign('-');       e.preventDefault(); }
  else if (e.key === 'Enter')              { navigateRow(1);     e.preventDefault(); }
  else if (e.key === 'Backspace')          { backspace();        e.preventDefault(); }
  else if (e.key === 'c' || e.key === 'C'){ clearActive();      e.preventDefault(); }
  else if (e.key === 'Tab')               { navigateRow(e.shiftKey ? -1 : 1); e.preventDefault(); }
  else if (/^[a-jA-J]$/.test(e.key))     { selectRowByLabel(e.key); e.preventDefault(); }
});

// ── Add row button ─────────────────────────────────────────────────────────
addRowBtn.addEventListener('click', () => addRow());

// ── Service Worker ─────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}

// ── Init ───────────────────────────────────────────────────────────────────
addRow();
</script>
</body>
